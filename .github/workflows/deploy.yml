name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # next.config.ts has output: "export", so this writes the static site to ./out
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Upload-only mirror into public_html (the FTP login lands there).
      # Nothing on the server is deleted, so .htaccess, robots.txt etc. are left alone.
      - name: Upload to public_html over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --verbose --no-perms --parallel=1 ./out/ ./;
            bye"
